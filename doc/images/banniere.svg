<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="AIM2K26_Prompting">
  <!-- Banniere du README : meme animation que le badge "Mode auto" de l'extension
       (extension/contenu/automode.js) - contour en degrade qui tourne, boucle du logo
       qui se dessine puis s'efface. -->
  <style>
    .logo {
      fill: none;
      stroke: url(#degrade-logo);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* Trou plus long que le trait : boucle effacee, aucun bout arrondi ne reste visible */
      stroke-dasharray: 100 110;
      animation: dessiner 2.4s ease-in-out infinite;
    }

    .titre {
      font: 700 60px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      fill: #ffffff;
    }

    .detail {
      font: 400 26px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      fill: rgba(255, 255, 255, 0.72);
    }

    @keyframes dessiner {
      0%   { stroke-dashoffset: 104; }
      50%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -104; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; stroke-dasharray: none; }
    }
  </style>

  <defs>
    <!-- Degrade du contour, tourne autour du centre comme le degrade conique du badge -->
    <linearGradient id="contour" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="1200" y2="150">
      <stop offset="0" stop-color="#7b1e2b"/>
      <stop offset="0.35" stop-color="#e11d48"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#7b1e2b"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 600 150" to="360 600 150" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="degrade-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Pastille sombre du badge, contour anime -->
  <rect x="3" y="3" width="1194" height="294" rx="40" fill="#111114" stroke="url(#contour)" stroke-width="4"/>

  <!-- Logo : meme trace que popup/logo.svg -->
  <svg x="140" y="85" width="150" height="130" viewBox="2.5 3 27 23.5">
    <path class="logo" pathLength="100"
          d="M4 25 C 11 25, 19 18, 19 11 C 19 6.5, 16 4.5, 13.5 4.5 C 10.5 4.5, 9 7, 9 10 C 9 17, 18 25, 28 25"/>
  </svg>

  <text class="titre" x="330" y="150">AIM2K26_Prompting</text>
  <text class="detail" x="333" y="196">Moteur NLP et Meta-Prompting pour LLM · 100 % local</text>
</svg>
