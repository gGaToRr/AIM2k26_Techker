# Themes des prompts : graines ecrites a la main.
#
# Quelques mots-cles SURS par theme : ils designent les prompts d'exemple a partir desquels
# corpus.ApprendreThemes apprend tout le vocabulaire de chaque theme sur le corpus
# (src/genPrompt/themes/modele.tsv). Mieux vaut peu de mots sans ambiguite que beaucoup de
# mots a double sens : un mot ambigu fait apprendre le mauvais vocabulaire.
#
#   <theme>.libelle  : nom affiche
#   <theme>.mots     : mots-cles valables dans toutes les langues
#   <theme>.mots.fr  : mots propres a une langue (fr, en, es, de) ; "chat" est un animal en
#                      francais, une discussion en anglais
# Une expression de plusieurs mots ("machine learning") exige tous ses mots.
# Les mots sont compares sans accents ni terminaisons (voir nlp.Racines).

