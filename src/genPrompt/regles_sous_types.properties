# ==============================================================================
# Regles de selection du sous-type (template) pour chaque archetype.
#
# Format, par archetype :
#   <ARCHETYPE>.ordre          = sous-types evalues, dans l ordre ; le premier
#                                satisfait l emporte
#   <ARCHETYPE>.defaut         = sous-type retenu si aucune regle ne correspond
#   <ARCHETYPE>.<sous-type>.motsCles        = declencheurs, separes par des virgules
#   <ARCHETYPE>.<sous-type>.contexteRequis  = optionnel ; au moins un de ces mots
#                                             doit etre present EN PLUS d un
#                                             declencheur
#   <ARCHETYPE>.<sous-type>.condition       = optionnel ; predicat integre, voir
#                                             SubTypeRules (traductionDetectee,
#                                             expressionCourteSansQuestion)
#
# Les mots-cles sont compares en minuscules et sans accents, sur le texte brut.
# Ce sont des fragments : "amelior" capture "ameliorer", "amelioration".
# Modifier ce fichier ne demande aucune recompilation.
# ==============================================================================

