# Workflow GitHub Actions pour exécuter la suite de tests TDD
# À placer dans .github/workflows/test.yml
name: Java TDD Test Suite

on:
  push:
    branches: [ main, premain, dev, nlp, genPrompt, cli-multiline ]
  pull_request:
    branches: [ main, premain, dev ]

jobs:
  test:
    name: Run All TDD Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Test Suite Script
        run: |
          chmod +x src/scripts/run_tests.sh
          ./src/scripts/run_tests.sh
