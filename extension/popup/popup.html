<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AIM2K26_Prompting</title>
    <link rel="stylesheet" href="popup.css">
    <script src="panneau.js"></script>
</head>
<body>
    <main class="fenetre">
        <header class="entete">
            <img class="logo" src="logo.svg" alt="">
            <h1 class="titre">AIM2K26</h1>
            <a class="lien-parametres" href="parametres.html" aria-label="Paramètres" title="Paramètres">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </a>
        </header>

        <section class="corps">
            <div class="colonne-gauche">
                <div class="tests">
                    <div class="ligne-test">
                        <button type="button" class="bouton" id="test-modeles">Test</button>
                        <span class="libelle">Tester mes modèles installés</span>
                    </div>
                    <div class="ligne-test">
                        <button type="button" class="bouton" id="test-java">Test</button>
                        <span class="libelle">Tester si Java est installé</span>
                    </div>
                </div>

                <hr class="separateur">

                <div class="section">
                    <p class="description">
                        Installez des modèles open source pour améliorer vos prompts directement
                        sur votre machine&nbsp;: <span class="insecable">100&nbsp;% hors-ligne</span>, privé et gratuit.
                    </p>
                    <a class="bouton" href="modeles.html">Télécharger les modèles</a>
                </div>

                <hr class="separateur">

                <div class="historique">
                    <h2 class="titre-section">Historique des prompts</h2>
                    <!-- Remplie par popup.js depuis l'historique, mise a jour en direct -->
                    <ul class="liste-historique" id="liste-historique">
                        <li class="message-liste">Aucun prompt amélioré pour l'instant.</li>
                    </ul>
                </div>
            </div>

            <textarea class="resultats" id="resultats" readonly
                      placeholder="Les résultats des tests s'afficheront ici."
                      aria-label="Résultats des tests"></textarea>
        </section>
    </main>
    <script src="connecteur.js"></script>
    <script src="historique.js"></script>
    <script src="popup.js"></script>
</body>
</html>
